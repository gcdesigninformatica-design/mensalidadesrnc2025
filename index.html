<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Mensalidades</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #paymentModalOverlay, #adminPasswordOverlay { transition: opacity 0.3s ease-in-out; }
        .loading-spinner { border-top-color: #2563eb; animation: spinner 0.6s linear infinite; }
        @keyframes spinner { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen p-4 pb-20">

    <div id="loadingOverlay" class="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center">
        <div class="w-12 h-12 border-4 border-slate-200 rounded-full loading-spinner mb-4"></div>
        <p class="text-slate-500 font-medium">Sincronizando dados...</p>
    </div>

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Cabeçalho Principal -->
        <header class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200 text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-blue-600"></div>
            <img src="https://i.imgur.com/VcDc5H6.png" alt="Ícone" class="mx-auto h-16 w-16 mb-4 rounded-2xl shadow-sm">
            <h1 class="text-3xl font-extrabold tracking-tight text-slate-800">Verificador de Pagamentos</h1>
            <p class="text-slate-500 mt-2">Gestão transparente de mensalidades e pendências.</p>
        </header>

        <!-- Barra de Busca Inteligente -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
            <div class="relative">
                <input type="text" id="searchInput" placeholder="Buscar por nome..." 
                    class="w-full pl-12 pr-4 py-4 bg-slate-50 border-none rounded-xl focus:ring-2 focus:ring-blue-500 transition-all text-lg"
                    oninput="buscarNome()">
                <svg class="w-6 h-6 text-slate-400 absolute left-4 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
        </section>

        <!-- Área de Resultados -->
        <main id="result" class="space-y-4">
            <div class="text-center py-20 bg-white rounded-3xl border-2 border-dashed border-slate-200">
                <p class="text-slate-400">A carregar banco de dados...</p>
            </div>
        </main>
    </div>

    <!-- Modal de Pagamento -->
    <div id="paymentModalOverlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50" onclick="fecharModalPagamento()">
        <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-sm w-full relative" onclick="event.stopPropagation()">
            <button onclick="fecharModalPagamento()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-600 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <h2 class="text-2xl font-bold text-slate-800 mb-1 text-center">Pagamento PIX</h2>
            <div class="space-y-5 mt-6">
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                    <p id="modalNome" class="text-slate-800 font-semibold"></p>
                    <p id="modalMes" class="text-blue-600 text-sm font-medium"></p>
                </div>
                <div class="bg-blue-600 p-6 rounded-2xl text-center text-white shadow-lg">
                    <p id="modalValor" class="text-4xl font-black">R$ 9,75</p>
                </div>
                <div class="flex mt-1 items-center bg-slate-50 border border-slate-200 rounded-xl overflow-hidden">
                    <input id="pixKeyInput" type="text" readonly class="bg-transparent p-4 w-full text-xs font-mono text-slate-600 outline-none">
                    <button id="copyPixButton" onclick="copiarChavePix()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-4 h-full transition py-4">Copiar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Senha Admin -->
    <div id="adminPasswordOverlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 hidden z-[60]" onclick="cancelarAdmin()">
        <div class="bg-white rounded-3xl shadow-2xl p-6 max-w-xs w-full relative" onclick="event.stopPropagation()">
            <h2 class="text-xl font-bold text-slate-800 mb-4 text-center">Acesso Restrito</h2>
            <input type="password" id="adminPasswordInput" placeholder="Senha" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 mb-4 text-center outline-none">
            <div id="adminPasswordError" class="text-red-500 text-xs text-center mb-4 hidden">Senha incorreta!</div>
            <div class="flex gap-2">
                <button onclick="cancelarAdmin()" class="flex-1 py-2 bg-slate-100 text-slate-600 rounded-xl font-bold">Cancelar</button>
                <button onclick="confirmarAdmin()" class="flex-1 py-2 bg-blue-600 text-white rounded-xl font-bold">Entrar</button>
            </div>
        </div>
    </div>

    <!-- Barra de Ferramentas Inferior -->
    <footer class="fixed bottom-0 left-0 w-full bg-white/80 backdrop-blur-md border-t border-slate-200 p-3 flex justify-center gap-4">
        <div class="flex items-center gap-3">
            <span id="adminLabel" class="text-sm font-medium text-slate-500">Modo Administrador</span>
            <div class="relative inline-block w-11 h-6 select-none">
                <input type="checkbox" id="adminToggle" class="sr-only peer" onchange="tratarCliqueAdmin(this)">
                <div class="w-full h-full bg-slate-200 rounded-full peer peer-checked:bg-blue-600 transition-colors after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-full"></div>
            </div>
        </div>
    </footer>

    <script type="module">

        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Configuração Firebase
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        // Variáveis de Estado
        let membros = [];
        let user = null;
        const VALOR_MENSALIDADE = 9.75;
        const SENHA_ADMIN = "1234";
        const meses = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
        const chavesPixMensais = ["", "", "", "00020101021126730014br.gov.bcb.pix0130gcdesign.informatica@gmail.com0217Mensalidade abril52040000530398654049.755802BR5919GABRIEL C H BRANDAO6013JOSE DE FREIT62070503***6304E94F", "00020101021126720014br.gov.bcb.pix0130gcdesign.informatica@gmail.com0216Mensalidade maio52040000530398654049.755802BR5919GABRIEL C H BRANDAO6013JOSE DE FREIT62070503***63046EE9", "00020101021126730014br.gov.bcb.pix0130gcdesign.informatica@gmail.com0217Mensalidade junho52040000530398654049.755802BR5919GABRIEL C H BRANDAO6013JOSE DE FREIT62070503***63047056", "00020101021126730014br.gov.bcb.pix0130gcdesign.informatica@gmail.com0217Mensalidade julho52040000530398654049.755802BR5919GABRIEL C H BRANDAO6013JOSE DE FREIT62070503***6304D488", "00020101021126740014br.gov.bcb.pix0130gcdesign.informatica@gmail.com0218Mensalidade agosto52040000530398654049.755802BR5919GABRIEL C H BRANDAO6013JOSE DE FREIT62070503***63043B23", "00020101021126760014br.gov.bcb.pix0130gcdesign.informatica@gmail.com0220Mensalidade setembro52040000530398654049.755802BR5919GABRIEL C H BRANDAO6013JOSE DE FREIT62070503***63044E48", "00020101021126750014br.gov.bcb.pix0130gcdesign.informatica@gmail.com0219Mensalidade outubro52040000530398654049.755802BR5919GABRIEL C H BRANDAO6013JOSE DE FREIT62070503***6304470A", "00020101021126760014br.gov.bcb.pix0130gcdesign.informatica@gmail.com0220Mensalidade novembro52040000530398654049.755802BR5919GABRIEL C H BRANDAO6013JOSE DE FREIT62070503***63042C4E", "00020101021126760014br.gov.bcb.pix0130gcdesign.informatica@gmail.com0220Mensalidade dezembro52040000530398654049.755802BR5919GABRIEL C H BRANDAO6013JOSE DE FREIT62070503***6304D4B9"];

        // Autenticação
        const initAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        };

        onAuthStateChanged(auth, (u) => {
            user = u;
            if (u) initSync();
        });

        // Sincronização em Tempo Real
        const initSync = () => {
            const collectionRef = collection(db, 'artifacts', appId, 'public', 'data', 'membros');
            
            onSnapshot(collectionRef, async (snapshot) => {
                if (snapshot.empty) {
                    await seedDatabase();
                    return;
                }
                membros = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                buscarNome();
                document.getElementById('loadingOverlay').classList.add('hidden');
            }, (error) => {
                console.error("Erro Firestore:", error);
            });
        };

        // Popular banco inicial se estiver vazio
        const seedDatabase = async () => {
            const initialData = [
                {"nome": "ALFREDO ALVES", "pagamentos": [true, true, true, true, true, true, true, false, false, false, false, false]},
                {"nome": "ANDERSON", "pagamentos": [true, true, true, true, true, true, true, true, true, true, false, false]},
                {"nome": "ANDRÉ", "pagamentos": [true, true, true, true, true, true, true, true, true, true, false, false]},
                {"nome": "EDUARDO RIBEIRO", "pagamentos": [true, true, true, true, true, true, true, true, true, true, true, true]},
                {"nome": "MATHEUS LAMARTINS", "pagamentos": [true, true, true, false, false, false, false, false, false, false, false, false]},
                {"nome": "CARLOS HENRIQUE", "pagamentos": [true, true, true, true, true, true, true, true, true, true, true, true]},
                {"nome": "CAROL", "pagamentos": [true, true, true, true, false, false, false, false, false, false, false, false]},
                {"nome": "CLÉSIO", "pagamentos": [true, true, true, true, true, false, false, false, false, false, false, false]},
                {"nome": "DANUSY", "pagamentos": [true, true, true, true, true, true, true, true, true, true, true, true]},
                {"nome": "DARNLEY", "pagamentos": [true, true, true, true, false, false, false, false, false, false, false, false]},
                {"nome": "LUIS DAVID", "pagamentos": [true, true, true, true, true, false, false, false, false, false, false, false]},
                {"nome": "LUIS EDUARDO", "pagamentos": [true, true, true, true, true, false, false, false, false, false, false, false]},
                {"nome": "ELIABIO", "pagamentos": [true, true, true, true, true, true, true, true, true, true, true, true]},
                {"nome": "EMANUEL FAUSTINO", "pagamentos": [true, true, true, true, true, true, false, false, false, false, false, false]},
                {"nome": "STEFANIA", "pagamentos": [true, true, true, true, true, true, true, true, true, true, true, true]},
                {"nome": "FERNANDO", "pagamentos": [true, true, true, false, false, false, false, false, false, false, false, false]},
                {"nome": "FLÁVIO", "pagamentos": [true, true, true, true, false, false, false, false, false, false, false, false]},
                {"nome": "GABRIEL", "pagamentos": [true, true, true, true, true, true, true, true, true, true, false, false]},
                {"nome": "MARIA GABRIELA", "pagamentos": [true, true, true, true, true, true, true, true, true, true, false, false]},
                {"nome": "HELDER FILHO", "pagamentos": [true, true, true, false, false, false, false, false, false, false, false, false]},
                {"nome": "HIAGO FAUSTINO", "pagamentos": [true, true, true, false, false, false, false, false, false, false, false, false]},
                {"nome": "HILDINAR", "pagamentos": [true, true, true, true, true, true, true, true, true, true, true, true]},
                {"nome": "ILANA", "pagamentos": [true, true, true, true, true, true, true, true, true, true, true, true]},
                {"nome": "JARBAS", "pagamentos": [true, true, true, true, true, true, true, true, true, true, true, true]},
                {"nome": "JOÃO MARCELO", "pagamentos": [true, true, true, true, true, true, false, false, false, false, false, false]},
                {"nome": "JOÃO MARCOS", "pagamentos": [true, true, true, false, false, false, false, false, false, false, false, false]},
                {"nome": "JOÃO PEDRO CRUZ", "pagamentos": [true, true, true, true, true, true, true, true, true, true, false, false]},
                {"nome": "JOÃO PEDRO SOARES", "pagamentos": [true, true, true, true, true, true, true, true, true, true, true, true]},
                {"nome": "JOÃO VICTOR ANDRADE", "pagamentos": [true, true, true, false, false, false, false, false, false, false, false, false]},
                {"nome": "JOÃO VITOR OLIVEIRA", "pagamentos": [true, true, true, true, true, true, false, false, false, false, false, false]},
                {"nome": "JOÃO VITOR ALVES", "pagamentos": [true, true, true, true, true, true, false, false, false, false, false, false]},
                {"nome": "JOSIANE", "pagamentos": [true, true, true, true, true, false, false, false, false, false, false, false]},
                {"nome": "JOYCE", "pagamentos": [true, true, true, false, false, false, false, false, false, false, false, false]},
                {"nome": "LETICIA", "pagamentos": [true, true, true, true, true, true, true, true, true, true, true, true]},
                {"nome": "MACYEL", "pagamentos": [true, true, true, true, false, false, false, false, false, false, false, false]},
                {"nome": "MARCIEL FERSAN", "pagamentos": [true, true, true, false, false, false, false, false, false, false, false, false]},
                {"nome": "MARIANE AQUINO", "pagamentos": [true, true, true, true, false, false, false, false, false, false, false, false]},
                {"nome": "MARIA PAULA", "pagamentos": [true, true, true, true, true, false, false, false, false, false, false, false]},
                {"nome": "MARINA", "pagamentos": [true, true, true, false, false, false, false, false, false, false, false, false]},
                {"nome": "MIKELLY", "pagamentos": [true, true, true, true, true, true, false, false, false, false, false, false]},
                {"nome": "NAELLY MORAIS", "pagamentos": [true, true, true, true, true, true, true, true, true, true, true, true]},
                {"nome": "PRISCILA", "pagamentos": [true, true, true, true, true, true, true, false, false, false, false, false]},
                {"nome": "RAFAEL", "pagamentos": [true, true, true, false, false, false, false, false, false, false, false, false]},
                {"nome": "RAUL", "pagamentos": [true, true, true, true, true, true, false, false, false, false, false, false]},
                {"nome": "REGINA", "pagamentos": [true, true, true, true, true, true, true, false, false, false, false, false]},
                {"nome": "ROSSELLY", "pagamentos": [true, true, true, true, true, false, false, false, false, false, false, false]},
                {"nome": "SARAH DANTAS", "pagamentos": [true, true, true, false, false, false, false, false, false, false, false, false]},
                {"nome": "SILVIO", "pagamentos": [true, true, true, true, true, true, true, true, true, false, false, false]},
                {"nome": "TAIANE", "pagamentos": [true, true, true, true, true, true, false, false, false, false, false, false]},
                {"nome": "THAIS", "pagamentos": [true, true, true, true, true, true, true, false, false, false, false, false]},
                {"nome": "VALÉRIA", "pagamentos": [true, true, true, false, false, false, false, false, false, false, false, false]},
                {"nome": "WESLEY SEREJO", "pagamentos": [true, true, true, false, false, false, false, false, false, false, false, false]},
                {"nome": "FRANCISCO WEVERTON", "pagamentos": [true, true, true, true, true, false, false, true, false, false, false, false]},
                {"nome": "WILLDECLAY", "pagamentos": [true, true, true, true, true, true, true, true, true, true, true, true]},
                {"nome": "YLANNA", "pagamentos": [true, true, true, true, true, false, false, false, false, false, false, false]},
                {"nome": "YÔRHAN", "pagamentos": [true, true, true, true, false, false, false, false, false, false, false, false]},
                {"nome": "THAIZY", "pagamentos": [true, true, true, true, true, true, true, false, false, false, false, false]}
            ];

            for (const m of initialData) {
                const docId = m.nome.toLowerCase().replace(/\s+/g, '_');
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'membros', docId), m);
            }
        };

        // Lógica de UI
        window.buscarNome = () => {
            const termo = document.getElementById('searchInput').value.trim().toUpperCase();
            const resultDiv = document.getElementById('result');
            
            const filtrados = membros.filter(m => m.nome.includes(termo));

            if (termo === "") {
                resultDiv.innerHTML = `<div class="text-center py-20 bg-white rounded-3xl border-2 border-dashed border-slate-200"><p class="text-slate-400 italic">Digite o nome de um membro para verificar o status...</p></div>`;
                return;
            }

            if (filtrados.length > 0) {
                let html = '';
                filtrados.forEach(membro => {
                    const totalPago = membro.pagamentos.filter(p => p).length;
                    const totalPendente = 12 - totalPago;
                    const valorDebito = totalPendente * VALOR_MENSALIDADE;

                    html += `
                        <article class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 fade-in">
                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-2">
                                <div><h3 class="text-xl font-bold text-slate-800">${membro.nome}</h3></div>
                                ${valorDebito > 0 ? `<span class="bg-red-50 text-red-700 px-4 py-1 rounded-full text-xs font-bold border border-red-100 uppercase">Pendente: R$ ${valorDebito.toFixed(2).replace('.',',')}</span>` : `<span class="bg-green-50 text-green-700 px-4 py-1 rounded-full text-xs font-bold border border-green-100 uppercase">Em dia</span>`}
                            </div>
                            <div class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-12 gap-2">
                                ${membro.pagamentos.map((pago, i) => `
                                    <button 
                                        onclick="window.acaoClique('${membro.id}', ${i}, ${pago})"
                                        class="w-full py-3 rounded-xl transition-all border-2 flex flex-col items-center justify-center
                                        ${pago ? 'bg-green-50 border-green-200 text-green-700' : 'bg-white border-slate-100 text-slate-400 hover:border-blue-200 hover:text-blue-600'}">
                                        <span class="text-[10px] font-bold uppercase">${meses[i]}</span>
                                    </button>
                                `).join('')}
                            </div>
                        </article>`;
                });
                resultDiv.innerHTML = html;
            } else {
                resultDiv.innerHTML = `<div class="text-center py-20 bg-white rounded-3xl border border-slate-200"><p class="text-slate-400">Nenhum membro encontrado.</p></div>`;
            }
        };

        window.acaoClique = (docId, mesIdx, estaPago) => {
            const isAdmin = document.getElementById('adminToggle').checked;
            const membro = membros.find(m => m.id === docId);
            if (isAdmin) {
                toggleStatus(docId, mesIdx);
            } else if (!estaPago) {
                abrirModalPagamento(membro.nome, meses[mesIdx], mesIdx);
            }
        };

        const toggleStatus = async (docId, mesIdx) => {
            if (!user) return;
            const membro = membros.find(m => m.id === docId);
            const novosPagamentos = [...membro.pagamentos];
            novosPagamentos[mesIdx] = !novosPagamentos[mesIdx];
            
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'membros', docId);
            await updateDoc(docRef, { pagamentos: novosPagamentos });
        };

        // Funções de Modal e Admin
        window.tratarCliqueAdmin = (checkbox) => {
            if (checkbox.checked) {
                checkbox.checked = false;
                document.getElementById('adminPasswordOverlay').classList.remove('hidden');
                document.getElementById('adminPasswordInput').focus();
            } else {
                document.getElementById('adminLabel').innerText = "Modo Administrador";
                document.getElementById('adminLabel').classList.remove('text-blue-600');
                buscarNome();
            }
        };

        window.confirmarAdmin = () => {
            if (document.getElementById('adminPasswordInput').value === SENHA_ADMIN) {
                document.getElementById('adminToggle').checked = true;
                document.getElementById('adminLabel').innerText = "Modo ADMIN Ativo";
                document.getElementById('adminLabel').classList.add('text-blue-600');
                cancelarAdmin();
                buscarNome();
            } else {
                document.getElementById('adminPasswordError').classList.remove('hidden');
            }
        };

        window.cancelarAdmin = () => {
            document.getElementById('adminPasswordOverlay').classList.add('hidden');
            document.getElementById('adminPasswordError').classList.add('hidden');
            document.getElementById('adminPasswordInput').value = "";
        };

        function abrirModalPagamento(nome, mes, mesIdx) {
            document.getElementById('modalNome').innerText = nome;
            document.getElementById('modalMes').innerText = "Mensalidade de " + mes;
            document.getElementById('pixKeyInput').value = chavesPixMensais[mesIdx] || "gcdesign.informatica@gmail.com";
            document.getElementById('paymentModalOverlay').classList.remove('hidden');
        }

        window.fecharModalPagamento = () => document.getElementById('paymentModalOverlay').classList.add('hidden');
        window.copiarChavePix = () => {
            const input = document.getElementById('pixKeyInput');
            input.select();
            document.execCommand('copy');
            document.getElementById('copyPixButton').innerText = 'Copiado!';
            setTimeout(() => document.getElementById('copyPixButton').innerText = 'Copiar', 2000);
        };

        initAuth();
    </script>
</body>
</html>
