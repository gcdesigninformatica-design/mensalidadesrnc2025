<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Mensalidades</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #paymentModalOverlay, #adminPasswordOverlay { transition: opacity 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen p-4 pb-20">

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Cabeçalho Principal -->
        <header class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200 text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-blue-600"></div>
            <img src="https://i.imgur.com/VcDc5H6.png" alt="Ícone" class="mx-auto h-16 w-16 mb-4 rounded-2xl shadow-sm">
            <h1 class="text-3xl font-extrabold tracking-tight text-slate-800">Verificador de Pagamentos</h1>
            <p class="text-slate-500 mt-2">Gestão transparente de mensalidades e pendências.</p>
        </header>

        <!-- Barra de Busca Inteligente -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
            <div class="relative">
                <input type="text" id="searchInput" placeholder="Buscar por nome..." 
                    class="w-full pl-12 pr-4 py-4 bg-slate-50 border-none rounded-xl focus:ring-2 focus:ring-blue-500 transition-all text-lg"
                    oninput="buscarNome()">
                <svg class="w-6 h-6 text-slate-400 absolute left-4 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
        </section>

        <!-- Área de Resultados -->
        <main id="result" class="space-y-4">
            <div class="text-center py-20 bg-white rounded-3xl border-2 border-dashed border-slate-200">
                <p class="text-slate-400 italic">Digite o nome de um membro para verificar o status...</p>
            </div>
        </main>
    </div>

    <!-- Modal de Pagamento -->
    <div id="paymentModalOverlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50" onclick="fecharModalPagamento()">
        <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-sm w-full relative" onclick="event.stopPropagation()">
            <button onclick="fecharModalPagamento()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-600 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <h2 class="text-2xl font-bold text-slate-800 mb-1 text-center">Pagamento PIX</h2>
            <div class="space-y-5 mt-6">
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                    <p id="modalNome" class="text-slate-800 font-semibold"></p>
                    <p id="modalMes" class="text-blue-600 text-sm font-medium"></p>
                </div>
                <div class="bg-blue-600 p-6 rounded-2xl text-center text-white shadow-lg">
                    <p id="modalValor" class="text-4xl font-black">R$ 0,00</p>
                </div>
                <div class="flex mt-1 items-center bg-slate-50 border border-slate-200 rounded-xl overflow-hidden">
                    <input id="pixKeyInput" type="text" readonly class="bg-transparent p-4 w-full text-xs font-mono text-slate-600 outline-none">
                    <button id="copyPixButton" onclick="copiarChavePix()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-4 h-full transition py-4">Copiar</button>
                </div>
                <p class="text-[10px] text-slate-400 text-center">Após pagar, envie o comprovante para o administrador.</p>
            </div>
        </div>
    </div>

    <!-- Modal de Senha Admin -->
    <div id="adminPasswordOverlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 hidden z-[60]" onclick="cancelarAdmin()">
        <div class="bg-white rounded-3xl shadow-2xl p-6 max-w-xs w-full relative" onclick="event.stopPropagation()">
            <h2 class="text-xl font-bold text-slate-800 mb-4 text-center">Acesso Restrito</h2>
            <input type="password" id="adminPasswordInput" placeholder="Senha" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 mb-4 text-center outline-none">
            <div id="adminPasswordError" class="text-red-500 text-xs text-center mb-4 hidden">Senha incorreta!</div>
            <div class="flex gap-2">
                <button onclick="cancelarAdmin()" class="flex-1 py-2 bg-slate-100 text-slate-600 rounded-xl font-bold">Cancelar</button>
                <button onclick="confirmarAdmin()" class="flex-1 py-2 bg-blue-600 text-white rounded-xl font-bold">Entrar</button>
            </div>
        </div>
    </div>

    <!-- Barra de Ferramentas Inferior -->
    <footer class="fixed bottom-0 left-0 w-full bg-white/80 backdrop-blur-md border-t border-slate-200 p-3 flex justify-center gap-4">
        <div class="flex items-center gap-3">
            <span id="adminLabel" class="text-sm font-medium text-slate-500">Modo Administrador</span>
            <div class="relative inline-block w-11 h-6 select-none">
                <input type="checkbox" id="adminToggle" class="sr-only peer" onchange="tratarCliqueAdmin(this)">
                <div class="w-full h-full bg-slate-200 rounded-full peer peer-checked:bg-blue-600 transition-colors after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-full"></div>
            </div>
        </div>
    </footer>

    <script>
        // Configurações Globais

        // Chave PIX atualizada para o número solicitado

        // Limpamos os códigos estáticos antigos para forçar o uso da nova chave 86995245100
        const chavesPixMensais = Array(12).fill("");

        // Base de Dados Estática (Local)

            {"nome": "ELIABIO", "pagamentos": [true, true, true, true, true, true, true, true, true, true, true, true]},
            {"nome": "EMANUEL FAUSTINO", "pagamentos": [true, true, true, true, true, true, true, true, true, true, true, true]},

            {"nome": "MARCIEL FERSAN", "pagamentos": [true, true, true, false, false, false, false, false, false, false, false, false]},
            {"nome": "MARIANE AQUINO", "pagamentos": [true, true, true, true, true, true, true, true, true, true, true, true]},
            {"nome": "MARIA PAULA", "pagamentos": [true, true, true, true, true, true, true, true, true, true, true, true]},
            {"nome": "MARINA", "pagamentos": [true, true, true, false, false, false, false, false, false, false, false, false]},
            {"nome": "MIKELLY", "pagamentos": [true, true, true, true, true, true, true, true, true, true, true, true]},
            {"nome": "NAELLY MORAIS", "pagamentos": [true, true, true, true, true, true, true, true, true, true, true, true]},
            {"nome": "PRISCILA", "pagamentos": [true, true, true, true, true, true, true, true, true, true, true, true]},
            {"nome": "RAFAEL", "pagamentos": [true, true, true, false, false, false, false, false, false, false, false, false]},
            {"nome": "RAUL", "pagamentos": [true, true, true, true, true, true, false, false, false, false, false, false]},
            {"nome": "REGINA", "pagamentos": [true, true, true, true, true, true, true, true, true, true, true, true]},
            {"nome": "ROSSELLY", "pagamentos": [true, true, true, true, true, true, true, true, true, true, true, true]},
            {"nome": "SARAH DANTAS", "pagamentos": [true, true, true, false, false, false, false, false, false, false, false, false]},
            {"nome": "SILVIO", "pagamentos": [true, true, true, true, true, true, true, true, true, false, false, false]},
            {"nome": "TAIANE", "pagamentos": [true, true, true, true, true, true, false, false, false, false, false, false]},
            {"nome": "THAIS", "pagamentos": [true, true, true, true, true, true, true, false, false, false, false, false]},
            {"nome": "VALÉRIA", "pagamentos": [true, true, true, false, false, false, false, false, false, false, false, false]},
            {"nome": "WESLEY SEREJO", "pagamentos": [true, true, true, false, false, false, false, false, false, false, false, false]},
            {"nome": "FRANCISCO WEVERTON", "pagamentos": [true, true, true, true, true, false, false, true, false, false, false, false]},
            {"nome": "WILLDECLAY", "pagamentos": [true, true, true, true, true, true, true, true, true, true, true, true]},
            {"nome": "YLANNA", "pagamentos": [true, true, true, true, true, false, false, false, false, false, false, false]},
            {"nome": "YÔRHAN", "pagamentos": [true, true, true, true, false, false, false, false, false, false, false, false]},
            {"nome": "THAIZY", "pagamentos": [true, true, true, true, true, true, true, true, true, true, true, true]}
        ];

        window.onload = () => {
            buscarNome();
            document.getElementById('adminPasswordInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') confirmarAdmin();
            });
        };

        // Lógica de UI
        window.buscarNome = () => {
            const termo = document.getElementById('searchInput').value.trim().toUpperCase();
            const resultDiv = document.getElementById('result');
            
            const filtrados = membros.filter(m => m.nome.includes(termo));

            if (termo === "") {
                resultDiv.innerHTML = `<div class="text-center py-20 bg-white rounded-3xl border-2 border-dashed border-slate-200"><p class="text-slate-400 italic">Digite o nome de um membro para verificar o status...</p></div>`;
                return;
            }

            if (filtrados.length > 0) {
                let html = '';
                filtrados.forEach(membro => {
                    const totalPago = membro.pagamentos.filter(p => p).length;
                    const totalPendente = 12 - totalPago;
                    const valorDebito = totalPendente * VALOR_MENSALIDADE;

                    html += `
                        <article class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 fade-in">
                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-2">
                                <div><h3 class="text-xl font-bold text-slate-800">${membro.nome}</h3></div>
                                ${valorDebito > 0 ? `<span class="bg-red-50 text-red-700 px-4 py-1 rounded-full text-xs font-bold border border-red-100 uppercase">Pendente: R$ ${valorDebito.toFixed(2).replace('.',',')}</span>` : `<span class="bg-green-50 text-green-700 px-4 py-1 rounded-full text-xs font-bold border border-green-100 uppercase">Em dia</span>`}
                            </div>
                            
                            <div class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-12 gap-2 mb-4">
                                ${membro.pagamentos.map((pago, i) => `
                                    <button 
                                        onclick="window.acaoClique('${membro.nome}', ${i}, ${pago})"
                                        class="w-full py-3 rounded-xl transition-all border-2 flex flex-col items-center justify-center
                                        ${pago ? 'bg-green-50 border-green-200 text-green-700' : 'bg-white border-slate-100 text-slate-400 hover:border-blue-200 hover:text-blue-600'}">
                                        <span class="text-[10px] font-bold uppercase">${meses[i]}</span>
                                    </button>
                                `).join('')}
                            </div>

                            ${valorDebito > 0 ? `
                                <button onclick="window.abrirModalPagamentoTotal('${membro.nome}', ${valorDebito})"
                                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl transition-all shadow-lg flex items-center justify-center gap-2 group">
                                    <svg class="w-5 h-5 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                                    Pagar Débito Total (R$ ${valorDebito.toFixed(2).replace('.',',')})
                                </button>
                            ` : ''}
                        </article>`;
                });
                resultDiv.innerHTML = html;
            } else {
                resultDiv.innerHTML = `<div class="text-center py-20 bg-white rounded-3xl border border-slate-200"><p class="text-slate-400">Nenhum membro encontrado.</p></div>`;
            }
        };

        window.acaoClique = (nome, mesIdx, estaPago) => {
            const isAdmin = document.getElementById('adminToggle').checked;
            if (isAdmin) {
                toggleStatus(nome, mesIdx);
            } else if (!estaPago) {
                abrirModalPagamentoMensal(nome, meses[mesIdx], mesIdx);
            }
        };

        const toggleStatus = (nome, mesIdx) => {
            const membro = membros.find(m => m.nome === nome);
            if (membro) {
                membro.pagamentos[mesIdx] = !membro.pagamentos[mesIdx];
                buscarNome();
            }
        };

        // Funções de Modal e Admin
        window.tratarCliqueAdmin = (checkbox) => {
            if (checkbox.checked) {
                checkbox.checked = false;
                document.getElementById('adminPasswordOverlay').classList.remove('hidden');
                document.getElementById('adminPasswordInput').focus();
            } else {
                document.getElementById('adminLabel').innerText = "Modo Administrador";
                document.getElementById('adminLabel').classList.remove('text-blue-600');
                buscarNome();
            }
        };

        window.confirmarAdmin = () => {
            if (document.getElementById('adminPasswordInput').value === SENHA_ADMIN) {
                document.getElementById('adminToggle').checked = true;
                document.getElementById('adminLabel').innerText = "Modo ADMIN Ativo";
                document.getElementById('adminLabel').classList.add('text-blue-600');
                cancelarAdmin();
                buscarNome();
            } else {
                document.getElementById('adminPasswordError').classList.remove('hidden');
            }
        };

        window.cancelarAdmin = () => {
            document.getElementById('adminPasswordOverlay').classList.add('hidden');
            document.getElementById('adminPasswordError').classList.add('hidden');
            document.getElementById('adminPasswordInput').value = "";
        };

        // Modal para Mês Específico
        function abrirModalPagamentoMensal(nome, mes, mesIdx) {
            document.getElementById('modalNome').innerText = nome;
            document.getElementById('modalMes').innerText = "Mensalidade de " + mes;
            document.getElementById('modalValor').innerText = "R$ " + VALOR_MENSALIDADE.toFixed(2).replace('.', ',');
            
            // Agora todas as mensalidades usarão a chave geral 86995245100
            const pixKey = chavesPixMensais[mesIdx] || CHAVE_PIX_GERAL;
            document.getElementById('pixKeyInput').value = pixKey;
            
            document.getElementById('paymentModalOverlay').classList.remove('hidden');
        }

        // Modal para Débito Total
        window.abrirModalPagamentoTotal = (nome, valor) => {
            document.getElementById('modalNome').innerText = nome;
            document.getElementById('modalMes').innerText = "Pagamento de Débito Total";
            document.getElementById('modalValor').innerText = "R$ " + valor.toFixed(2).replace('.', ',');
            
            document.getElementById('pixKeyInput').value = CHAVE_PIX_GERAL;
            
            document.getElementById('paymentModalOverlay').classList.remove('hidden');
        };

        window.fecharModalPagamento = () => {
            document.getElementById('paymentModalOverlay').classList.add('hidden');
            document.getElementById('copyPixButton').innerText = 'Copiar';
        };

        window.copiarChavePix = () => {
            const input = document.getElementById('pixKeyInput');
            input.select();
            document.execCommand('copy');
            document.getElementById('copyPixButton').innerText = 'Copiado!';
            setTimeout(() => {
                if(!document.getElementById('paymentModalOverlay').classList.contains('hidden')) {
                    document.getElementById('copyPixButton').innerText = 'Copiar';
                }
            }, 2000);
        };
    </script>
</body>
</html>
